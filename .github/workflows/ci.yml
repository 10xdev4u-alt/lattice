name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Lint tools (WebMCP spec budgets)
        run: npm run lint:tools
      - name: Build
        run: npm run build

  docker:
    name: Docker build, test, artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Test target: build + run the whole vitest suite in-container.
      - name: Build & run test target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          load: true
          tags: lattice:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Runtime target: the shippable image. Exported as a
      # gzipped tarball artifact (~57MB vs ~238MB raw).
      - name: Build runtime image
        run: docker build --target runtime -t lattice:runtime .
      - name: Smoke test the runtime container
        run: |
          docker run -d --name lattice-smoke -p 8888:8888 lattice:runtime
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8888/api/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8888/api/healthz
          # Boot check: the app shell (/app/) must reference assets
          # the server can actually serve (a missing Readable import
          # once made every asset 404 while healthz stayed green).
          # / serves landing.html and /app/ the workspace — check
          # both routes and the entry assets they reference.
          curl -sf -o /dev/null http://localhost:8888/
          curl -sf -o /dev/null "http://localhost:8888/app/"
          ASSET=$(docker exec lattice-smoke sh -c "grep -o 'assets/index-[^\"]*\.js' /app/dist/index.html | head -1")
          echo "checking /$ASSET"
          curl -sf -o /dev/null -w '%{content_type}\n' "http://localhost:8888/$ASSET" | grep -qi 'javascript'
          CSS=$(docker exec lattice-smoke sh -c "grep -o 'assets/[a-zA-Z0-9._-]*\.css' /app/dist/index.html | head -1")
          echo "checking /$CSS"
          curl -sf -o /dev/null -w '%{content_type}\n' "http://localhost:8888/$CSS" | grep -qi 'text/css'
          SHARE_JS=$(docker exec lattice-smoke sh -c "grep -o 'assets/share-[^\"]*\.js' /app/dist/share.html | head -1")
          echo "checking /$SHARE_JS"
          curl -sf -o /dev/null -w '%{content_type}\n' "http://localhost:8888/$SHARE_JS" | grep -qi 'javascript'
          curl -sI http://localhost:8888/api/healthz | grep -qi 'permissions-policy: tools=(self)'
          docker rm -f lattice-smoke
      - name: Export compressed artifact
        run: docker save lattice:runtime | gzip -6 > lattice-image.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lattice-image
          path: lattice-image.tar.gz
          retention-days: 7

