<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a3a"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#b69bff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(80,180)">
    <text font-family="Inter, system-ui" font-weight="600" font-size="32" fill="#9aa0aa">WebMCP Challenge · 2026</text>
    <text font-family="Inter, system-ui" font-weight="700" font-size="120" fill="#ececf1" y="120">Research papers,</text>
    <text font-family="Inter, system-ui" font-weight="700" font-size="120" fill="url(#accent)" y="260"><tspan font-style="italic">in conversation.</tspan></text>
    <text font-family="Inter, system-ui" font-weight="400" font-size="28" fill="#9aa0aa" y="340">The page is the audit log. 14 typed WebMCP tools.</text>
    <g transform="translate(0,400)">
      <rect width="180" height="60" rx="8" fill="#7c6cff"/>
      <text font-family="Inter, system-ui" font-weight="500" font-size="20" fill="white" x="40" y="38">Open the demo →</text>
    </g>
  </g>
  <g transform="translate(900,140)" stroke="#7c6cff" stroke-width="2" fill="none" opacity="0.5">
    <rect x="0" y="0" width="200" height="200" rx="8"/>
    <line x1="0" y1="50" x2="200" y2="50"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="150" x2="200" y2="150"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
  </g>
</svg>
