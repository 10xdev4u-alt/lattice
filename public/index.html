<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Lattice: research papers, in conversation. A WebMCP-powered workspace." />
    <title>Lattice</title>
    <meta name="description" content="Lattice — research papers, in conversation. A WebMCP-powered workspace." />
    <meta property="og:title" content="Lattice" />
    <meta property="og:description" content="Research papers, in conversation." />
    <meta property="og:image" content="/og.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/styles/lattice.css" />
  </head>
  <body>
    <a class="skip-link" href="#app-main">Skip to main content</a>
    <div id="app" data-state="loading">
      <header class="app-header" role="banner">
        <div class="app-logo">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M8 8 L24 8 M8 8 L8 24 M24 8 L24 24 M8 24 L24 24 M16 8 L16 24 M8 16 L24 16" />
          </svg>
          <h1 class="app-title">Lattice</h1>
        </div>
        <div class="app-trace-host" id="protocol-trace-host"></div>
        <p class="app-tagline" id="webmcp-status">
          <span class="status-dot" data-state="warn" aria-hidden="true"></span>
          <span data-status-text>Checking WebMCP…</span>
        </p>
        <div class="live-indicator" id="live-indicator" data-live="0" aria-live="polite">
          <span class="live-dot" aria-hidden="true"></span>
          <span class="live-tool" data-live-text>idle</span>
        </div>
        <div class="header-meta">
          <span id="session-timer-host" aria-live="polite"></span>
          <time id="session-timestamp-host" aria-label="Session started"></time>
        </div>
      </header>
      <div data-toast-host aria-live="polite"></div>
    <main class="app-main" id="app-main" role="main">
      <p class="empty-state">Loading the workspace…</p>
    </main>
    <div id="status-bar-host" role="status" aria-label="Session status"></div>
    </div>
    <script src="/assets/theme-guard.js"></script>
    <script type="module" src="/assets/main.ts"></script>
  </body>
</html>
