  </head>
  <body>
    <div id="app" data-state="loading">
      <header class="app-header" role="banner">
        <div class="app-logo">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M8 8 L24 8 M8 8 L8 24 M24 8 L24 24 M8 24 L24 24 M16 8 L16 24 M8 16 L24 16" />
          </svg>
          <h1 class="app-title">Lattice</h1>
        </div>
        <div class="app-trace-host" id="protocol-trace-host"></div>
        <p class="app-tagline" id="webmcp-status">
          <span class="status-dot" data-state="warn" aria-hidden="true"></span>
          <span data-status-text>Checking WebMCP…</span>
        </p>
        <div class="live-indicator" id="live-indicator" data-live="0" aria-live="polite">
          <span class="live-dot" aria-hidden="true"></span>
          <span class="live-tool" data-live-text>idle</span>
        </div>
      </header>
      <div id="session-timer-host" style="position: absolute; top: 16px; right: 16px;"></div>
    <div id="session-timestamp-host" style="position: absolute; bottom: 6px; right: 16px; font-size: 10px; color: var(--fg-muted); font-family: var(--font-mono);"></div>
    <main class="app-main" id="app-main" role="main">
      <p class="empty-state">Loading the workspace…</p>
    </main>
    <footer class="app-footer">
      <button class="report-problem" data-action="report-problem">Report a problem</button>
    </footer>
    </div>
    <script>
      // Apply the saved theme before first paint — no flash of the
      // wrong scheme. Default: the ink-dark manuscript.
      (function () {
        try {
          var t = localStorage.getItem('lattice.theme.v1');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script type="module" src="/assets/main.ts"></script>
  </body>
</html>
