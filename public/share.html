<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shared Lattice session</title>
    <meta name="description" content="A shared Lattice research session — read-only, encrypted in the URL fragment." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/styles/lattice.css" />
    <script>
      // Match the app's theme before first paint.
      (function () {
        try {
          var t = localStorage.getItem('lattice.theme.v1');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app" data-state="loading">
      <header class="app-header">
        <h1 class="app-title">Lattice</h1>
        <p class="app-tagline">Shared session</p>
      </header>
      <main class="app-main" id="app-main" role="main">
        <p class="empty-state">Loading shared session…</p>
      </main>
    </div>
    <script type="module" src="./assets/share-entry.ts"></script>
  </body>
</html>
