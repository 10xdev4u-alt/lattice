<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shared Lattice session</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/styles/tokens.css" />
    <link rel="stylesheet" href="/assets/styles/base.css" />
    <link rel="stylesheet" href="/assets/styles/trail.css" />
    <link rel="stylesheet" href="/assets/styles/share.css" />
  </head>
  <body>
    <div id="app" data-state="loading">
      <header class="app-header">
        <h1 class="app-title">Lattice</h1>
        <p class="app-tagline">Shared session</p>
      </header>
      <main class="app-main" id="app-main" role="main">
        <p class="empty-state">Loading shared session…</p>
      </main>
    </div>
    <script type="module">
      import { mountShareView, decodeSessionFromFragment, decryptAsync } from '/assets/share.ts';
      const params = new URLSearchParams(window.location.hash.slice(1));
      const fragment = params.get('share') ?? '';
      const passphrase = params.get('p') ? window.prompt('This link is encrypted. Enter the passphrase:') ?? '' : '';
      let payload = null;
      if (fragment && passphrase) {
        const json = await decryptAsync(fragment, passphrase);
        if (json) payload = JSON.parse(json);
      } else {
        payload = decodeSessionFromFragment(fragment);
      }
      const root = document.getElementById('app-main');
      if (!root) return;
      if (!payload) {
        root.innerHTML = '<p class="empty-state">Invalid or missing share link. Wrong passphrase?</p>';
      } else {
        mountShareView(root, payload);
      }
      document.getElementById('app')?.setAttribute('data-state', 'ready');
    </script>
  </body>
</html>
