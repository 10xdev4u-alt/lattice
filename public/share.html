<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shared Lattice session</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/styles/tokens.css" />
    <link rel="stylesheet" href="/assets/styles/base.css" />
    <link rel="stylesheet" href="/assets/styles/trail.css" />
    <link rel="stylesheet" href="/assets/styles/share.css" />
  </head>
  <body>
    <div id="app" data-state="loading">
      <header class="app-header">
        <h1 class="app-title">Lattice</h1>
        <p class="app-tagline">Shared session</p>
      </header>
      <main class="app-main" id="app-main" role="main">
        <p class="empty-state">Loading shared session…</p>
      </main>
    </div>
    <script type="module">
      import { mountShareView, decodeSessionFromFragment } from '/assets/share.ts';
      const fragment = window.location.hash.replace(/^#share=/, '');
      const session = fragment ? decodeSessionFromFragment(fragment) : null;
      const root = document.getElementById('app-main');
      if (!root) return;
      if (!session) {
        root.innerHTML = '<p class="empty-state">Invalid or missing share link.</p>';
      } else {
        mountShareView(root, session);
      }
      document.getElementById('app')?.setAttribute('data-state', 'ready');
    </script>
  </body>
</html>
